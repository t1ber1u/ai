name: Benchmark Qwen GGUF

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "Direct URL to GGUF model file"
        required: true
        type: string
      max_tokens:
        description: "Max tokens to generate"
        required: false
        default: "128"
        type: string
      prompt:
        description: "Prompt to test"
        required: false
        default: "Raspunde scurt in romana: Ce este inteligenta artificiala?"
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl git

      - name: Print initial system info
        run: |
          date
          uname -a
          nproc
          free -h
          df -h

      - name: Run Qwen benchmark
        env:
          MODEL_URL: ${{ inputs.model_url }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          PROMPT: ${{ inputs.prompt }}
          THREADS: "4"
        run: |
          chmod +x scripts/benchmark_qwen.sh
          scripts/benchmark_qwen.sh

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: benchmark-output.log

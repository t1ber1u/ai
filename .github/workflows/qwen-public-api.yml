name: Qwen Public API

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "GGUF model URL (default: Qwen3-4B-Instruct-2507 Q4_K_M)"
        required: false
        default: "https://huggingface.co/z8086486/Qwen3-4B-Instruct-2507-Q4_K_M-GGUF/resolve/main/qwen3-4b-instruct-2507-q4_k_m.gguf"
        type: string
      ctx_size:
        description: "Context window in tokens (Qwen3-4B trained to 262144). Memory: ~144 KB/token KV. 16384=~2.3GB, 32768=~4.6GB."
        required: false
        default: "16384"
        type: string
  schedule:
    # 14:00 UTC = 17:00 Romania during EEST (UTC+3)
    - cron: "0 14 * * *"

jobs:
  qwen-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/z8086486/Qwen3-4B-Instruct-2507-Q4_K_M-GGUF/resolve/main/qwen3-4b-instruct-2507-q4_k_m.gguf' }}
      MODEL_FILE: models/qwen3-4b-instruct-2507-q4.gguf
      CTX_SIZE: ${{ inputs.ctx_size || '16384' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl wget

      - name: Build llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git
          cmake -B llama.cpp/build -S llama.cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j 4
          ls -la llama.cpp/build/bin

      - name: Download GGUF model
        run: |
          mkdir -p models
          echo "MODEL_URL=$MODEL_URL"
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "$MODEL_FILE" "$MODEL_URL"
          ls -lh "$MODEL_FILE"

      - name: Install cloudflared
        run: |
          wget -q -O /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start llama-server
        env:
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          echo "================================================================"
          echo "Step: Start llama-server"
          echo "================================================================"

          if [ -n "${LLAMA_API_KEY:-}" ]; then
            echo "LLAMA_API_KEY:            SET (value masked by GitHub Actions)"
            echo "API key auth:             ENABLED  (--api-key passed to llama-server)"
            API_KEY_ARG=(--api-key "$LLAMA_API_KEY")
          else
            echo "LLAMA_API_KEY:            NOT SET"
            echo "API key auth:             DISABLED (endpoint will be UNAUTHENTICATED)"
            API_KEY_ARG=()
          fi
          echo "Binding to:               127.0.0.1:8000"
          echo "Model file:               $MODEL_FILE"
          echo "Context size:             ${CTX_SIZE} tokens"
          echo

          nohup llama.cpp/build/bin/llama-server \
            -m "$MODEL_FILE" \
            --host 127.0.0.1 \
            --port 8000 \
            --ctx-size "$CTX_SIZE" \
            --threads 4 \
            "${API_KEY_ARG[@]}" \
            > llama-server.log 2>&1 &
          SERVER_PID=$!
          echo "Started llama-server PID=$SERVER_PID"

          echo
          echo "--- Waiting for /health to return 200 (up to 180s) ---"
          SERVER_UP=0
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Server reports healthy after ${i}s."
              SERVER_UP=1
              break
            fi
            sleep 1
          done

          echo
          echo "--- Last 80 lines of llama-server.log ---"
          tail -80 llama-server.log || true
          echo

          if [ "$SERVER_UP" -ne 1 ]; then
            echo "ERROR: llama-server did not become healthy within 180s."
            echo "Aborting before starting the Cloudflare tunnel."
            exit 1
          fi

          echo "--- Local probe: GET /health ---"
          curl -s -w '\nHTTP_STATUS=%{http_code}\n' http://127.0.0.1:8000/health
          echo

          echo "--- Local probe: POST /v1/chat/completions ---"
          AUTH_HEADER=()
          if [ -n "${LLAMA_API_KEY:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${LLAMA_API_KEY}")
          fi
          curl -s --max-time 60 \
            "${AUTH_HEADER[@]}" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Raspunde scurt in romana: salut"}],"max_tokens":32,"temperature":0.2}' \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            http://127.0.0.1:8000/v1/chat/completions || true
          echo
          echo "(If HTTP_STATUS=200 and JSON contains a choices[].message, the server is fully working locally.)"

      - name: Start Cloudflare Tunnel (keeps job alive for up to 6h)
        env:
          CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
        run: |
          echo "================================================================"
          echo "Step: Start Cloudflare Tunnel"
          echo "================================================================"

          if [ -n "${CLOUDFLARED_TUNNEL_TOKEN:-}" ]; then
            echo "CLOUDFLARED_TUNNEL_TOKEN: SET (value masked by GitHub Actions)"
            echo "Tunnel mode:              NAMED"
            echo "Expected public URL:      whatever public hostname you mapped in"
            echo "                          Cloudflare → Tunnels → qwen-api → Published"
            echo "                          application routes (e.g. https://qwen.price.com.ro)"
            echo "Endpoint:                 <public URL>/v1/chat/completions"
            echo
            echo "Running: cloudflared tunnel run --token \$CLOUDFLARED_TUNNEL_TOKEN"
            echo "This step blocks until the 6h job timeout, manual cancel, or tunnel error."
            echo
            exec cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARED_TUNNEL_TOKEN"
          else
            echo "CLOUDFLARED_TUNNEL_TOKEN: NOT SET"
            echo "Tunnel mode:              EPHEMERAL (trycloudflare.com)"
            echo "Look in the cloudflared output below for: https://<random>.trycloudflare.com"
            echo
            exec cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000
          fi

      - name: Upload llama-server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-log
          path: llama-server.log
